services:
  - type: web
    name: golf-pool-tracker-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # set this to your Vercel URL after deploy
      - key: PYTHON_VERSION
        value: "3.11.9"
